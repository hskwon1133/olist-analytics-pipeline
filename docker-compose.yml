# 1단계: 분석용 PostgreSQL만 띄운다. (Airflow 서비스는 다음 단계에서 추가)
services:
  postgres:
    image: postgres:16.4
    container_name: olist-postgres
    environment:
      POSTGRES_USER: ${PGUSER:-olist}
      POSTGRES_PASSWORD: ${PGPASSWORD:-olist}
      POSTGRES_DB: ${PGDATABASE:-olist}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-olist} -d ${PGDATABASE:-olist}"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
